[project]
name = "simple-backup-operator"
version = "0.1.0"
description = "Kubernetes operator for managing BackupJob resources"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kubernetes>=28.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]
