replicaCount: 1

image:
  repository: ghcr.io/reonokiy/simple-backup-operator
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

watchNamespace: ""

operator:
  logLevel: INFO

backupImage:
  repository: ghcr.io/reonokiy/simple-backup
  tag: latest
  pullPolicy: IfNotPresent

storageConfigs: {}
