suite: test service account
templates:
  - serviceaccount.yaml
tests:
  - it: should create service account by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-simple-backup-operator-charts

  - it: should not create service account when disabled
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use custom service account name
    set:
      serviceAccount:
        name: custom-operator-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-operator-sa

  - it: should add service account annotations
    set:
      serviceAccount:
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/my-role
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/my-role
