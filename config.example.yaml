# Simple Backup Configuration File (YAML)
# Copy this file to config.yaml and customize for your needs

source_path: /path/to/backup

cron_schedule: ""

compression: tar.zst

archive_name: ""

retention:
  max_backups: 0
  daily: 7
  weekly: 4
  monthly: 6
  yearly: 2

encryption:
  enabled: false
  recipient: ""
  identity: ""

# Destinations Configuration
# You can backup to multiple destinations simultaneously
destinations:
  - service: s3
    root: backups/
    storage:
      bucket: my-backup-bucket
      region: us-east-1
      access_key_id: AKIAxxxxx
      secret_access_key: xxxxx

# Additional destination examples (commented out):

# S3-compatible storage with custom endpoint:
#   - service: s3
#     root: backups/
#     storage:
#       bucket: my-bucket
#       region: us-west-2
#       access_key_id: AKIAxxxxx
#       secret_access_key: xxxxx
