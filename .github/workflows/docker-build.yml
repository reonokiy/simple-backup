name: Docker Build and Release

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          # Determine the tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            TAG=latest
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            TAG=develop
          else
            TAG=${GITHUB_SHA::8}
          fi
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "repo_owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and push (PR - build only)
        if: github.event_name == 'pull_request'
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          targets: default
          set: |
            *.platform=linux/amd64
            *.output=type=cacheonly

      - name: Build and push (Push/Tag)
        if: github.event_name != 'pull_request'
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          targets: default
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REPO_OWNER: ${{ steps.meta.outputs.repo_owner }}

      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### simple-backup" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/simple-backup:${{ steps.meta.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/simple-backup:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### simple-backup-operator" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/simple-backup-operator:${{ steps.meta.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/simple-backup-operator:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
