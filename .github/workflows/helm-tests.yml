name: Helm and Operator Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-tests.yml'

jobs:
  operator-tests:
    name: Operator Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        working-directory: helm/simple-backup-operator/operator
        run: uv sync

      - name: Run operator tests
        working-directory: helm/simple-backup-operator/operator
        run: uv run pytest test_operator.py -v --cov=operator --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./helm/simple-backup-operator/operator/coverage.xml
          flags: operator
          name: operator-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  helm-chart-tests:
    name: Helm Chart Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest

      - name: Run Helm chart tests
        run: helm unittest helm/simple-backup-operator

      - name: Lint Helm chart
        run: helm lint helm/simple-backup-operator

  helm-template-validation:
    name: Helm Template Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Template chart with default values
        run: helm template test helm/simple-backup-operator

      - name: Template chart with custom values
        run: |
          cat > /tmp/custom-values.yaml <<EOF
          replicaCount: 2
          image:
            repository: custom/operator
            tag: v1.0.0
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/my-role
          watchNamespace: "monitoring"
          operator:
            logLevel: DEBUG
          EOF
          helm template test helm/simple-backup-operator -f /tmp/custom-values.yaml
